
name: Ecommerce VPS CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecommerce-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            root@${{ secrets.VPS_HOST }} \
            "echo Connected"

      - name: Upload files
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='*.log' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            ./ root@${{ secrets.VPS_HOST }}:/root/ecommerce_project_prod_1/

      - name: Install and restart
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            root@${{ secrets.VPS_HOST }} <<'ENDSSH'
            set -e
            cd /root/ecommerce_project_prod_1
            npm ci --omit=dev
            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save
            curl --fail http://127.0.0.1:3000/ > /dev/null
            echo "Deployment successful"
          ENDSSH
