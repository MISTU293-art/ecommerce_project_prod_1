
name: Deploy Ecommerce to VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecommerce-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Ubuntu VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test VPS connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "echo 'SSH connection successful'"

      - name: Copy project to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='.git/' \
            --exclude='*.log' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            ./ "$VPS_USER@$VPS_HOST:/root/ecommerce_project_prod_1/"

      - name: Install dependencies and restart application
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" << 'EOF'
            set -e

            cd /root/ecommerce_project_prod_1

            echo "Installing production dependencies..."
            npm ci --omit=dev

            echo "Restarting application..."
            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save

            echo "Waiting for application startup..."

            for i in {1..20}; do
              if curl --connect-timeout 3 --silent --fail \
                http://127.0.0.1:3000/ > /dev/null; then
                echo "Deployment successful!"
                exit 0
              fi

              echo "Attempt $i: Application not ready..."
              sleep 2
            done

            echo "Deployment failed!"
            pm2 status
            pm2 logs ecommerce-staging --lines 50 --nostream
            exit 1
          EOF
